# Checks the Rust deploy CLI under tee/cli: its own Cargo workspace, with its
# own Makefile, pinned toolchain and lockfile, so nothing here reaches the rest
# of the monorepo. Path-filtered like the other component workflows.
#
# Two jobs build the workspace. `check` is the required one and is hermetic:
# fmt, clippy, and the test suite, which replays the committed founding
# archive (tee/networks/fixture-devnet) through the pinned enclave verifier,
# so a pin bump that judges those quotes differently goes red here. `drift`
# runs the guards that shell out to `seismic-reth genesis-hash` and `summit
# genesis digest` over every committed network directory, with the binaries
# of the seismic-images release `IMAGE` pins below, so only a commit here can
# turn it red. Whether the newest seismic-reth and
# summit would still derive the same chains is a question upstream merges
# answer, not commits here; seismic-tee-drift-nightly.yml asks it on a cron.
name: seismic-tee

on:
  push:
    branches: [main]
    paths:
      - "tee/**"
      - ".github/workflows/seismic-tee.yml"
  pull_request:
    paths:
      - "tee/**"
      - ".github/workflows/seismic-tee.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the build/clippy/test toolchain, and rustup
      # installs it on first use; nightly is here only to format with. Both are
      # installed by hand rather than by dtolnay/rust-toolchain, which would
      # make whichever it installed last the default — and the default is what
      # rust-cache reads below.
      - name: Install toolchains
        working-directory: tee/cli
        run: |
          # Installs the pin and prints "<pin> (overridden by .../rust-toolchain.toml)".
          rustup default "$(rustup show active-toolchain | head -1 | cut -d' ' -f1)"
          rustup toolchain install nightly --profile minimal --component rustfmt

      # `workspaces`: the Cargo workspace is under tee/cli, not at the repo
      # root, so the cache action has to be told where the lockfile is. It has
      # no such input for its own working directory, though, and it derives part
      # of the key by running `rustc -vV` — at the repo root, where
      # rust-toolchain.toml does not apply. Hence the `rustup default` above:
      # without it the key carries today's nightly version and rotates daily,
      # and the cache never hits.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tee/cli
      - uses: taiki-e/install-action@nextest

      # Fails unless Cargo.lock already agrees with Cargo.toml, so CI builds the
      # committed resolution and the pinned enclave rev cannot drift. Ordered
      # before `check`, which would silently rewrite a stale lock first.
      - run: make -C tee/cli locked
      - run: make -C tee/cli check

  # The installer (tee/cli/install.sh) is POSIX sh that operators run through
  # `| sh` on machines this repo knows nothing about, so it is held to
  # ShellCheck here on every change. Its real test — installing a release it
  # just published, on each platform — is seismic-tee-release.yml's `install`
  # job.
  check-install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck --shell=sh tee/cli/install.sh

  drift:
    # 24.04 rather than -latest: the image's binaries are lifted from its
    # initrd and linked against the host's glibc and OpenSSL here, so the
    # runner's userland is part of what this job pins.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The seismic-images release whose seismic-reth and summit the gates
      # run. A stopgap: a network directory names the release it was founded
      # on (the stem of `measurement_id` in its inputs/measurements.json), but
      # fixture-devnet was founded on a seismic-dev build with no release to
      # fetch, and this release's binaries derive the same chain from it.
      # When SEI-701 replaces the fixture with a released image's archive,
      # this job reads the image from the directory and the pin goes.
      IMAGE: seismic_2026-09-28.00fbf5
    steps:
      - uses: actions/checkout@v6

      # The drift guards (tee/cli/network/tests/drift.rs) link the enclave
      # crates at the rev the workspace pins, so the rev under test is the
      # pinned one, and moving it is a PR that bumps the pin, not something CI
      # discovers. Same toolchain setup as `check`.
      - name: Install toolchains
        working-directory: tee/cli
        run: rustup default "$(rustup show active-toolchain | head -1 | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tee/cli
      - uses: taiki-e/install-action@nextest

      # The image's own binaries, checked the way `seismic-tee network
      # assemble` checks them (fetch_sums in tee/cli/network/src/image.rs):
      # SHA256SUMS must carry a build provenance attestation from
      # seismic-images' release workflow (RELEASE_SIGNER there), and both
      # binaries must match it. GH_TOKEN is only for `gh`'s API calls; the
      # release itself is public.
      - name: Install ${{ env.IMAGE }}'s seismic-reth and summit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/$IMAGE"
          mkdir -p "$bin"
          cd "$bin"
          for asset in SHA256SUMS seismic-reth summit; do
            curl -fsSL -o "$asset" \
              "https://github.com/SeismicSystems/seismic-images/releases/download/$IMAGE/$asset"
          done
          gh attestation verify SHA256SUMS --repo SeismicSystems/seismic-images \
            --cert-identity https://github.com/SeismicSystems/seismic-images/.github/workflows/seismic.yml@refs/heads/seismic
          # Two lines or nothing: `sha256sum -c` passes a file its list omits.
          grep -E '^[0-9a-f]{64}  (seismic-reth|summit)$' SHA256SUMS > binaries.sha256
          [ "$(wc -l < binaries.sha256)" = 2 ] || {
            echo "$IMAGE's SHA256SUMS does not list both seismic-reth and summit" >&2
            exit 1
          }
          sha256sum -c binaries.sha256
          chmod +x seismic-reth summit
          ./seismic-reth --version
          # TODO: `--version` once summit reports one (SEI-560).
          ./summit --help > /dev/null
          echo "$bin" >> "$GITHUB_PATH"

      - run: make -C tee/cli locked
      - run: make -C tee/cli drift
