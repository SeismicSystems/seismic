name: Typescript Client

on:
  push:
    branches: ["main"]
    paths:
      - "clients/ts/**"
      - "mise.toml"
      - "pitchfork.toml"
      - ".github/workflows/client-ts.yml"
      - ".github/actions/setup-sfoundry/**"
      - ".github/actions/setup-sreth/**"
  pull_request:
    paths:
      - "clients/ts/**"
      - "mise.toml"
      - "pitchfork.toml"
      - ".github/workflows/client-ts.yml"
      - ".github/actions/setup-sfoundry/**"
      - ".github/actions/setup-sreth/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: clients/ts

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('clients/ts/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: mise run lint::check
      - run: mise run typecheck
      - run: mise run build
      - run: mise run test::unit

  test-sanvil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
        with:
          install_args: bun pitchfork
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('clients/ts/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: ./.github/actions/setup-sfoundry
        with:
          channel: nightly
      - run: mise run test::integration::sanvil

  test-sreth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
        with:
          install_args: bun pitchfork
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('clients/ts/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - id: sreth
        uses: ./.github/actions/setup-sreth
        with:
          version: nightly
      # SRETH_BIN makes the sreth::start-local mise task (reached via
      # pitchfork) run the prebuilt binary instead of a sibling
      # seismic-reth checkout.
      - env:
          SRETH_BIN: ${{ steps.sreth.outputs.seismic-reth-path }}
        run: mise run test::integration::sreth
