<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="700" viewBox="0 0 1340 700" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .title { font-size: 17px; font-weight: bold; fill: #222; }
    .system { fill: #f6f6f6; stroke: #9a9a9a; stroke-width: 1.5; }
    .system-label { font-size: 13px; font-weight: bold; fill: #333; text-anchor: middle; }
    .spine { stroke: #555; stroke-width: 2; }
    .layer { stroke-width: 1.5; }
    .layer.by-key { fill: #dbe8ff; stroke: #3b6fd8; }
    .layer.open { fill: #dff3df; stroke: #2f8f2f; }
    .layer.by-address { fill: #ffe6cc; stroke: #e07b00; }
    .layer.by-platform { fill: #ececec; stroke: #888888; }
    .layer-label { font-size: 12px; fill: #222; }
    .layer-label-below { font-size: 11px; fill: #444; font-style: italic; text-anchor: middle; }
    .member { fill: #222; }
    .relay { fill: #ffffff; stroke: #222; stroke-width: 2; }
    .note { font-size: 12px; fill: #333; }
    .faces { font-size: 11px; fill: #555; text-anchor: middle; }
  </style>

  <rect class="bg" x="0" y="0" width="1340" height="700"/>

  <text class="title" x="40" y="34">The layers under option C: systems are columns, layers are bars</text>

  <!-- systems -->
  <g class="system-client"><rect class="system" x="40" y="60" width="150" height="485" rx="10"/><text class="system-label" x="115" y="567">client</text><text class="faces" x="115" y="583">wallet, SDK</text></g>
  <g class="system-cli"><rect class="system" x="220" y="60" width="150" height="485" rx="10"/><text class="system-label" x="295" y="567">operator CLI, CI</text><text class="faces" x="295" y="583">seismic-tee</text></g>
  <g class="system-front"><rect class="system" x="400" y="60" width="150" height="485" rx="10"/><text class="system-label" x="475" y="567">front</text><text class="faces" x="475" y="583">L7 relay</text></g>
  <g class="system-scraper"><rect class="system" x="580" y="60" width="150" height="485" rx="10"/><text class="system-label" x="655" y="567">metrics scraper</text><text class="faces" x="655" y="583">operator monitoring</text></g>
  <g class="system-node-a"><rect class="system" x="760" y="60" width="300" height="485" rx="10"/><text class="system-label" x="910" y="567">node A</text><text class="faces" x="910" y="583">TEE guest, this operator</text></g>
  <g class="system-node-b"><rect class="system" x="1110" y="60" width="210" height="485" rx="10"/><text class="system-label" x="1215" y="567">node B</text><text class="faces" x="1215" y="583">TEE guest, any operator</text></g>

  <!-- spines: the layers one system takes part in, stacked; drawn behind the bars -->
  <line class="spine" x1="115" y1="115" x2="115" y2="500"/>
  <line class="spine" x1="295" y1="205" x2="295" y2="500"/>
  <line class="spine" x1="475" y1="115" x2="475" y2="500"/>
  <line class="spine" x1="655" y1="160" x2="655" y2="500"/>
  <line class="spine" x1="910" y1="115" x2="910" y2="500"/>
  <line class="spine" x1="1215" y1="250" x2="1215" y2="500"/>

  <!-- service layers -->
  <g class="layer-public-https"><rect class="layer open" x="55" y="100" width="985" height="30" rx="15"/><text class="layer-label" x="510" y="119">public HTTPS · names: Host + path · enrollment: none</text></g>
  <g class="layer-operator-http"><rect class="layer by-address" x="595" y="145" width="445" height="30" rx="15"/><text class="layer-label" x="685" y="164">operator HTTP · metrics, summit</text></g>

  <!-- layers between nodes and the operator -->
  <g class="layer-operator-admin"><rect class="layer by-address" x="235" y="190" width="805" height="30" rx="15"/><text class="layer-label" x="330" y="209">operator admin · :8080 config, :7879 harvest, reth RPC · enrollment: source address</text></g>
  <g class="layer-consensus"><rect class="layer by-key" x="780" y="235" width="525" height="30" rx="15"/><text class="layer-label" x="945" y="254">consensus · :18551 · validator set</text></g>
  <g class="layer-devp2p"><rect class="layer open" x="780" y="275" width="525" height="30" rx="15"/><text class="layer-label" x="945" y="294">devp2p · :30303 · gossip: every node relays</text></g>
  <g class="layer-root-key"><rect class="layer by-key" x="780" y="315" width="525" height="30" rx="15"/><text class="layer-label" x="945" y="334">root-key · :7878 · attestation + registry</text></g>

  <!-- networks -->
  <g class="layer-public-internet"><rect class="layer open" x="55" y="375" width="1250" height="30" rx="15"/><text class="layer-label" x="510" y="394">public internet · names: public IPs · enrollment: none</text></g>
  <g class="layer-vnet"><rect class="layer by-address" x="415" y="425" width="625" height="30" rx="15"/><text class="layer-label" x="685" y="444">operator VNet · firewall per port</text></g>

  <!-- fabrics and access networks -->
  <g class="layer-client-access"><rect class="layer by-platform" x="55" y="485" width="120" height="30" rx="15"/><text class="layer-label-below" x="115" y="532">LAN, ISP</text></g>
  <g class="layer-cli-access"><rect class="layer by-platform" x="235" y="485" width="120" height="30" rx="15"/><text class="layer-label-below" x="295" y="532">LAN, ISP</text></g>
  <g class="layer-azure-fabric"><rect class="layer by-platform" x="415" y="485" width="625" height="30" rx="15"/><text class="layer-label" x="685" y="504">cloud fabric (Azure)</text></g>
  <g class="layer-node-b-fabric"><rect class="layer by-platform" x="1125" y="485" width="180" height="30" rx="15"/><text class="layer-label-below" x="1215" y="532">its provider's fabric</text></g>

  <!-- memberships: a dot is a system taking part in that layer; a diamond relays -->
  <g class="client-members"><circle class="member" cx="115" cy="115" r="7"/><circle class="member" cx="115" cy="390" r="7"/><circle class="member" cx="115" cy="500" r="7"/></g>
  <g class="cli-members"><circle class="member" cx="295" cy="205" r="7"/><circle class="member" cx="295" cy="390" r="7"/><circle class="member" cx="295" cy="500" r="7"/></g>
  <g class="front-members"><path class="relay" d="M475,105 L485,115 L475,125 L465,115 z"/><circle class="member" cx="475" cy="390" r="7"/><circle class="member" cx="475" cy="440" r="7"/><circle class="member" cx="475" cy="500" r="7"/></g>
  <g class="scraper-members"><circle class="member" cx="655" cy="160" r="7"/><circle class="member" cx="655" cy="440" r="7"/><circle class="member" cx="655" cy="500" r="7"/></g>
  <g class="node-a-members">
    <circle class="member" cx="910" cy="115" r="7"/><circle class="member" cx="910" cy="160" r="7"/><circle class="member" cx="910" cy="205" r="7"/>
    <circle class="member" cx="910" cy="250" r="7"/><path class="relay" d="M910,280 L920,290 L910,300 L900,290 z"/><circle class="member" cx="910" cy="330" r="7"/>
    <circle class="member" cx="910" cy="390" r="7"/><circle class="member" cx="910" cy="440" r="7"/><circle class="member" cx="910" cy="500" r="7"/>
  </g>
  <g class="node-b-members">
    <circle class="member" cx="1215" cy="250" r="7"/><path class="relay" d="M1215,280 L1225,290 L1215,300 L1205,290 z"/><circle class="member" cx="1215" cy="330" r="7"/>
    <circle class="member" cx="1215" cy="390" r="7"/><circle class="member" cx="1215" cy="500" r="7"/>
  </g>

  <!-- legend -->
  <g class="legend" transform="translate(40,620)">
    <circle class="member" cx="8" cy="0" r="7"/><text class="note" x="22" y="4">member: the system takes part in that layer</text>
    <path class="relay" d="M330,-10 L340,0 L330,10 L320,0 z"/><text class="note" x="348" y="4">relay: forwards the layer's messages between other members</text>
    <text class="note" x="0" y="26">DNS picks the front for a hostname; the front's path map picks the node and port. A line passing behind a bar is not a member of it.</text>
    <text class="note" x="0" y="46">Relays not drawn: the routers inside the public internet, the Azure fabric's hosts and switches, and LAN switches.</text>
    <text class="note" x="0" y="72">admits members:</text>
    <rect class="layer by-key" x="110" y="59" width="40" height="18" rx="9"/><text class="note" x="158" y="72">by key</text>
    <rect class="layer open" x="230" y="59" width="40" height="18" rx="9"/><text class="note" x="278" y="72">openly</text>
    <rect class="layer by-address" x="350" y="59" width="40" height="18" rx="9"/><text class="note" x="398" y="72">by address or network membership</text>
    <rect class="layer by-platform" x="630" y="59" width="40" height="18" rx="9"/><text class="note" x="678" y="72">by the platform</text>
  </g>
</svg>
