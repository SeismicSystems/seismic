<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1150"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    text { fill: #374151; font-size: 14px; }
    .title    { font-size: 30px; font-weight: 700; fill: #1e40af; }
    .subtitle { font-size: 15px; fill: #64748b; }
    .b        { font-weight: 700; font-size: 15px; }
    .sub      { font-size: 13px; fill: #64748b; }
    .band > rect  { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .band > text  { font-size: 16px; font-weight: 600; fill: #1e40af; }
    /* status of a mechanism: border style carries it (as in trust-chain.svg) */
    .shipped { fill: #dbeafe; stroke: #1e3a5f; stroke-width: 2; }
    .planned { fill: #ffffff; stroke: #1e3a5f; stroke-width: 2; stroke-dasharray: 8 5; }
    .open    { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
    .open-text { fill: #64748b; }
    /* a box outside the network at that time */
    .out     { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .out-text { fill: #94a3b8; }
    .root    { fill: #a7f3d0; stroke: #047857; stroke-width: 2; }
    .rail    { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 12 6; }
    .rail-label { font-size: 16px; font-weight: 600; fill: #6d28d9; }
    .oob     { stroke: #7c3aed; stroke-width: 2.5; fill: none; }
    .oob.planned-oob { stroke-dasharray: 7 6; }
    .entry   { fill: #7c3aed; stroke: #7c3aed; stroke-width: 2; }
    .entry.planned-entry { fill: #ffffff; }
    .model   { font-size: 14px; font-weight: 600; fill: #6d28d9; }
    /* a finalized change: signed by that epoch's validators */
    .cert    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .cert.open-cert { fill: #ffffff; stroke-dasharray: 2 3; }
    .epoch-line { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .head-line  { stroke: #1e3a5f; stroke-width: 2; }
    .axis    { stroke: #1e3a5f; stroke-width: 2; fill: none; }
    .flow    { stroke: #64748b; stroke-width: 2; fill: none; }
    .flow-label { font-size: 13px; fill: #374151; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrow-oob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="2000" height="1150" fill="#ffffff"/>

  <text class="title" x="40" y="52">Identities over time</text>
  <text class="subtitle" x="40" y="80">network_id fixes the lineage; the head is its value at h; the control plane is chain state</text>

  <!-- ================= legend ================= -->
  <rect class="shipped" x="880" y="104" width="120" height="30" rx="7"/>
  <text x="940" y="124" text-anchor="middle">shipped</text>
  <rect class="planned" x="1020" y="104" width="200" height="30" rx="7"/>
  <text x="1120" y="124" text-anchor="middle">decided, not built</text>
  <rect class="open" x="1240" y="104" width="150" height="30" rx="7"/>
  <text class="open-text" x="1315" y="124" text-anchor="middle">open decision</text>
  <rect class="cert" x="1412" y="110" width="18" height="18"/>
  <text x="1440" y="124">a finalized change</text>
  <line class="oob" x1="1610" y1="119" x2="1660" y2="119" marker-end="url(#arrow-oob)"/>
  <text x="1670" y="124">side-channel input</text>

  <!-- ================= time axis and epochs ================= -->
  <line class="axis" x1="520" y1="170" x2="1930" y2="170" marker-end="url(#arrow-axis)"/>
  <text x="510" y="175" text-anchor="end">block 0</text>
  <text x="690" y="160" text-anchor="middle">epoch 0 · signed by V0</text>
  <text x="1030" y="160" text-anchor="middle">epoch 1 · V1</text>
  <text x="1370" y="160" text-anchor="middle">epoch 2 · V1</text>
  <text x="1720" y="160" text-anchor="middle">epoch 3 · V2</text>
  <line class="epoch-line" x1="860" y1="165" x2="860" y2="790"/>
  <line class="epoch-line" x1="1200" y1="165" x2="1200" y2="790"/>
  <line class="epoch-line" x1="1540" y1="165" x2="1540" y2="790"/>
  <line class="head-line" x1="1900" y1="150" x2="1900" y2="1110"/>
  <text class="b" x="1908" y="192">head h</text>

  <!-- ================= genesis artifacts, committed by network_id ================= -->
  <g transform="translate(40,100)">
    <rect class="root" width="330" height="56" rx="28"/>
    <text class="b" x="165" y="34" text-anchor="middle">network_id = SHA-256(manifest)</text>
  </g>
  <path class="flow" d="M 70 156 V 505 H 88" marker-end="url(#arrow)"/>
  <line class="flow" x1="70" y1="255" x2="88" y2="255" marker-end="url(#arrow)"/>
  <line class="flow" x1="70" y1="385" x2="88" y2="385" marker-end="url(#arrow)"/>
  <text class="flow-label" x="80" y="190">commits to</text>

  <g transform="translate(90,215)">
    <rect class="shipped" width="280" height="80" rx="10"/>
    <text class="b" x="14" y="28">summit genesis</text>
    <text x="14" y="54">V0: founding validators</text>
  </g>
  <g transform="translate(90,345)">
    <rect class="shipped" width="280" height="80" rx="10"/>
    <text class="b" x="14" y="28">reth genesis</text>
    <text x="14" y="50">P0: registry storage</text>
    <text class="sub" x="14" y="70">(+ manifest copy for joiners)</text>
  </g>
  <g transform="translate(90,475)">
    <rect class="planned" width="280" height="80" rx="10"/>
    <text class="b" x="14" y="28">tx_io_pk@0 pin</text>
    <text class="sub" x="14" y="52">K0: manifest root_key section</text>
    <text class="sub" x="14" y="70">(summit genesis to follow)</text>
  </g>


  <!-- ================= lane V: validator set ================= -->
  <g class="band">
    <rect x="400" y="190" width="1490" height="110" rx="12"/>
    <text x="420" y="214">V · validator set — summit consensus state</text>
  </g>
  <rect class="shipped" x="520" y="230" width="340" height="50"/>
  <text x="536" y="260">V0</text>
  <rect class="shipped" x="860" y="230" width="680" height="50"/>
  <text x="876" y="260">V1 = V0 + a deposit</text>
  <rect class="shipped" x="1540" y="230" width="350" height="50"/>
  <text x="1556" y="260">V2 = V1 − an exit</text>
  <rect class="cert" x="851" y="246" width="18" height="18"/>
  <rect class="cert" x="1531" y="246" width="18" height="18"/>

  <!-- ================= lane P: accepted images ================= -->
  <g class="band">
    <rect x="400" y="320" width="1490" height="110" rx="12"/>
    <text x="420" y="344">P · accepted images — MeasurementRegistry, reth state</text>
  </g>
  <rect class="shipped" x="520" y="360" width="480" height="50"/>
  <text x="536" y="390">P0 = {A}</text>
  <rect class="shipped" x="1000" y="360" width="380" height="50"/>
  <text x="1016" y="390">P1 = {A, B}: B admitted</text>
  <rect class="shipped" x="1380" y="360" width="510" height="50"/>
  <text x="1396" y="390">P2 = {B}: A deprecated</text>
  <rect class="cert" x="991" y="376" width="18" height="18"/>
  <rect class="cert" x="1371" y="376" width="18" height="18"/>

  <!-- ================= lane K: service key ================= -->
  <g class="band">
    <rect x="400" y="450" width="1490" height="110" rx="12"/>
    <text x="420" y="474">K · service key tx_io_pk@(root_version, epoch) — later records: open</text>
  </g>
  <rect class="planned" x="520" y="490" width="680" height="50"/>
  <text x="536" y="520">K0 = tx_io_pk@(0, 0)</text>
  <rect class="open" x="1200" y="490" width="340" height="50"/>
  <text class="open-text" x="1216" y="520">K1 = @(0, 1): epoch bump</text>
  <rect class="open" x="1540" y="490" width="350" height="50"/>
  <text class="open-text" x="1556" y="520">K2 = @(1, 0): root rotation</text>
  <rect class="cert open-cert" x="1191" y="506" width="18" height="18"/>
  <rect class="cert open-cert" x="1531" y="506" width="18" height="18"/>

  <!-- each lane starts from its genesis artifact -->
  <line class="flow" x1="370" y1="255" x2="518" y2="255" marker-end="url(#arrow)"/>
  <line class="flow" x1="370" y1="385" x2="518" y2="385" marker-end="url(#arrow)"/>
  <line class="flow" x1="370" y1="515" x2="518" y2="515" marker-end="url(#arrow)"/>
  <text class="flow-label" x="424" y="247">t = 0</text>

  <!-- ================= machines ================= -->
  <g class="band">
    <rect x="40" y="580" width="1850" height="210" rx="12"/>
    <text x="60" y="606">machines — a box is a member while its image ∈ P and it holds the root_key K commits to</text>
  </g>
  <text x="60" y="645">box 1 · image A</text>
  <text x="60" y="695">box 2 · A, then B</text>
  <text x="60" y="745">box 3 · image B</text>

  <rect class="shipped" x="520" y="622" width="860" height="36" rx="6"/>
  <text x="536" y="645">A ∈ P: member</text>
  <rect class="out" x="1380" y="622" width="510" height="36" rx="6"/>
  <text class="out-text" x="1396" y="645">A ∉ P2: no longer admitted</text>

  <rect class="shipped" x="520" y="672" width="620" height="36" rx="6"/>
  <text x="536" y="695">A ∈ P: member</text>
  <rect class="shipped" x="1150" y="672" width="740" height="36" rx="6"/>
  <text x="1166" y="695">re-imaged to B, rejoins: fetches root_key</text>

  <rect class="out" x="520" y="722" width="520" height="36" rx="6"/>
  <text class="out-text" x="536" y="745">not yet booted</text>
  <rect class="shipped" x="1050" y="722" width="840" height="36" rx="6"/>
  <text x="1066" y="745">joins once B ∈ P1: fetches root_key</text>

  <!-- ================= clients ================= -->
  <g class="band">
    <rect x="40" y="810" width="1850" height="300" rx="12"/>
    <text x="60" y="836">clients — where each model takes side-channel trust, and what it verifies from there</text>
  </g>
  <rect class="rail" x="56" y="850" width="320" height="248" rx="12"/>

  <!-- genesis + light client -->
  <text class="model" x="72" y="880">genesis + light client</text>
  <text class="sub" x="72" y="898">in: network_id</text>
  <line class="oob" x1="376" y1="885" x2="512" y2="885" marker-end="url(#arrow-oob)"/>
  <circle class="entry" cx="520" cy="885" r="7"/>
  <line class="flow" x1="528" y1="885" x2="1890" y2="885" marker-end="url(#arrow)"/>
  <text class="flow-label" x="540" y="877">every epoch's finality certificate from genesis; applies V, reads K</text>

  <!-- checkpoint + light client -->
  <text class="model" x="72" y="940">checkpoint + light client</text>
  <text class="sub" x="72" y="958">in: + a finalized header</text>
  <line class="oob" x1="376" y1="945" x2="1192" y2="945" marker-end="url(#arrow-oob)"/>
  <circle class="entry" cx="1200" cy="945" r="7"/>
  <line class="flow" x1="1208" y1="945" x2="1890" y2="945" marker-end="url(#arrow)"/>
  <text class="flow-label" x="1220" y="937">the same, from the checkpoint on</text>

  <!-- attested head (proposed) -->
  <text class="model" x="72" y="1000">attested head · proposed</text>
  <text class="sub" x="72" y="1018">in: + the accepted images</text>
  <line class="oob planned-oob" x1="376" y1="1005" x2="1890" y2="1005" marker-end="url(#arrow-oob)"/>
  <circle class="entry planned-entry" cx="1900" cy="1005" r="7"/>
  <text class="flow-label" x="1880" y="997" text-anchor="end">one quote binding the head and tx_io_pk; checks the head's timestamp</text>

  <!-- pinned key -->
  <text class="model" x="72" y="1060">pinned key</text>
  <text class="sub" x="72" y="1078">in: tx_io_pk itself</text>
  <line class="oob" x1="376" y1="1065" x2="1890" y2="1065" marker-end="url(#arrow-oob)"/>
  <circle class="entry" cx="1900" cy="1065" r="7"/>
  <text class="flow-label" x="1880" y="1057" text-anchor="end">verifies nothing</text>
</svg>
