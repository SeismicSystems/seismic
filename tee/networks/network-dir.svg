<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1040"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    text { fill: #374151; font-size: 13px; }
    .title    { font-size: 26px; font-weight: 700; fill: #1e40af; }
    .h2       { font-size: 20px; font-weight: 700; fill: #1e40af; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .zonelabel { font-size: 14px; font-weight: 600; fill: #1e40af; }
    .caption, .edgelabel { font-size: 12px; fill: #64748b; }
    .edgelabel.green { fill: #047857; }
    .edgelabel.small { font-size: 11px; }
    /* node boxes: g.node.KIND groups positioned by translate(x,y); child rect + centered text */
    .node > rect { stroke-width: 2; }
    .node > text { text-anchor: middle; dominant-baseline: middle; }
    .authored  > rect { fill: #fed7aa; stroke: #c2410c; }
    .derived   > rect { fill: #93c5fd; stroke: #1e3a5f; }
    .derived   > text { fill: #1e3a5f; }
    .tool      > rect { fill: #3b82f6; stroke: #1e3a5f; }
    .tool      > text { fill: #ffffff; }
    .ephemeral > rect { fill: #dbeafe; stroke: #1e40af; stroke-dasharray: 6 4; }
    .ephemeral > text { fill: #1e40af; }
    .harvested > rect { fill: #ddd6fe; stroke: #6d28d9; }
    .harvested > text { fill: #6d28d9; }
    .endpoint > ellipse { fill: #a7f3d0; stroke: #047857; stroke-width: 2; }
    .endpoint > text { fill: #047857; text-anchor: middle; dominant-baseline: middle; font-size: 14px; }
    /* edges: solid = bytes flow, dashed = hash commitment */
    .flow { stroke: #1e3a5f; stroke-width: 2; fill: none; }
    .flow.green  { stroke: #047857; }
    .flow.purple { stroke: #6d28d9; }
    .pin  { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .zone { fill: none; stroke: #64748b; stroke-dasharray: 6 4; }
    .divider { stroke: #64748b; stroke-dasharray: 6 4; }
    .code-bg { fill: #1e293b; }
    .code { fill: #22c55e; font-size: 12px; }
  </style>
  <defs>
    <marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e3a5f"/>
    </marker>
    <marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#047857"/>
    </marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect width="1620" height="1040" fill="#ffffff"/>

  <!-- ================= header ================= -->
  <text class="title" x="40" y="52">Network directory: inputs/ → artifact set</text>
  <text class="subtitle" x="40" y="80">everything top-level is hash-pinned by network-manifest.json; everything under inputs/ is provenance</text>

  <!-- legend -->
  <g class="legend">
    <rect x="990" y="30" width="14" height="14" rx="3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
    <text class="caption" x="1012" y="41">authored input</text>
    <rect x="990" y="52" width="14" height="14" rx="3" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text class="caption" x="1012" y="63">harvested from the live cohort</text>
    <line class="flow" x1="1250" y1="37" x2="1294" y2="37"/>
    <text class="caption" x="1304" y="41">bytes flow</text>
    <line class="pin" x1="1250" y1="59" x2="1294" y2="59"/>
    <text class="caption" x="1304" y="63">hash commitment</text>
  </g>

  <!-- ================= section 1: assemble ================= -->
  <!-- inputs/ zone: four authored files + the harvested facts, one per row -->
  <rect class="zone" x="40" y="100" width="360" height="495" rx="8"/>
  <text class="zonelabel" x="56" y="126">inputs/ — authored + harvested</text>
  <text class="zonelabel" x="440" y="126">assemble</text>
  <text class="zonelabel" x="660" y="126">artifact set — derived, hash-pinned</text>

  <!-- row 1: measurements -->
  <g class="node authored" transform="translate(60,150)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">measurements.json</text>
  </g>
  <text class="caption" x="65" y="212">raw PCR map from make measure</text>

  <!-- row 2: eth genesis -->
  <g class="node authored" transform="translate(60,240)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">reth-genesis.json</text>
  </g>
  <text class="caption" x="65" y="302">policy-free genesis (reth dev template)</text>

  <!-- row 3: summit params -->
  <g class="node authored" transform="translate(60,330)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">summit-genesis.toml</text>
  </g>
  <text class="caption" x="65" y="392">consensus parameter choices; namespace</text>

  <!-- row 4: founder credentials -->
  <g class="node authored" transform="translate(60,420)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">founder-withdrawal-credentials.json</text>
  </g>
  <text class="caption" x="65" y="482">one address per founder, node-name order</text>

  <!-- row 5: harvested founding facts -->
  <g class="node harvested" transform="translate(60,510)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">harvest/&lt;node&gt;.json</text>
  </g>
  <text class="caption" x="65" y="572">TEE-born keys + quotes + what verified them (network harvest)</text>

  <!-- artifact set -->
  <g class="node derived" transform="translate(660,150)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">measurement-policy-bootstrap.json</text>
  </g>
  <g class="node derived" transform="translate(660,240)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">reth-genesis.json</text>
  </g>
  <g class="node derived" transform="translate(660,420)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">summit-genesis.toml</text>
  </g>
  <text class="caption" x="665" y="486">validator set filled: harvested keys +</text>
  <text class="caption" x="665" y="503">credentials + assemble-time IPs</text>

  <!-- assemble arrows, one per input row -->
  <line class="flow" x1="385" y1="173" x2="650" y2="173" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="413" y="166">promote (admission CLI)</text>
  <line class="flow" x1="385" y1="263" x2="650" y2="263" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="398" y="256">copy + inject registry storage</text>
  <path class="flow" d="M385 353 L650 435" marker-end="url(#m-dark)"/>
  <line class="flow" x1="385" y1="443" x2="650" y2="443" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="420" y="425">set-validators (summit emits)</text>
  <path class="flow" d="M385 533 L650 452" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="400" y="545">harvested keys fill the validator set</text>
  <text class="edgelabel" x="400" y="562">(quotes re-verified vs policy first)</text>

  <!-- intra-artifact edges -->
  <path class="flow green" d="M760 196 V235" marker-end="url(#m-green)"/>
  <text class="edgelabel green" x="772" y="220">compile → registry storage slots</text>
  <path class="pin" d="M700 286 V415" marker-end="url(#m-grey)"/>
  <text class="edgelabel" x="712" y="340">eth_genesis_hash</text>

  <!-- manifest: pure output, pins every artifact -->
  <g class="manifest">
    <rect x="1200" y="140" width="380" height="390" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
    <text x="1220" y="172" font-size="16" font-weight="700" fill="#1e3a5f">network-manifest.json</text>
    <text class="caption" x="1220" y="194">pure output — never hand-edited</text>
    <rect class="code-bg" x="1218" y="206" width="344" height="308" rx="6"/>
    <!-- indentation via explicit tspan x (leading spaces collapse in XML) -->
    <text class="code" y="230">
      <tspan x="1232">{</tspan>
      <tspan x="1246" dy="18">"manifest_version": 1,</tspan>
      <tspan x="1246" dy="18">"name": "..",</tspan>
      <tspan x="1246" dy="18">"eth": {</tspan>
      <tspan x="1260" dy="18">"chain_id": 5124,</tspan>
      <tspan x="1260" dy="18">"genesis_hash": "0x.."</tspan>
      <tspan x="1246" dy="18">},</tspan>
      <tspan x="1246" dy="18">"summit": {</tspan>
      <tspan x="1260" dy="18">"genesis_config_digest": "0x..",</tspan>
      <tspan x="1260" dy="18">"namespace": ".."</tspan>
      <tspan x="1246" dy="18">},</tspan>
      <tspan x="1246" dy="18">"measurements": {</tspan>
      <tspan x="1260" dy="18">"bootstrap_policy_hash": "0x..",</tspan>
      <tspan x="1260" dy="18">"contracts": { reg, auth }</tspan>
      <tspan x="1246" dy="18">}</tspan>
      <tspan x="1232" dy="18">}</tspan>
    </text>
  </g>

  <!-- hash pins into the manifest -->
  <line class="pin" x1="985" y1="173" x2="1195" y2="173" marker-end="url(#m-grey)"/>
  <text class="edgelabel small" x="988" y="166">sha256 → bootstrap_policy_hash</text>
  <line class="pin" x1="985" y1="263" x2="1195" y2="263" marker-end="url(#m-grey)"/>
  <text class="edgelabel small" x="988" y="256">genesis-hash → eth.genesis_hash</text>
  <line class="pin" x1="985" y1="443" x2="1195" y2="443" marker-end="url(#m-grey)"/>
  <text class="edgelabel small" x="988" y="421">summit genesis digest →</text>
  <text class="edgelabel small" x="988" y="436">genesis_config_digest</text>
  <text class="edgelabel small" x="988" y="459">(validator IPs excluded)</text>

  <!-- network_id = sha256(manifest bytes) -->
  <path class="pin" d="M1390 530 V557" marker-end="url(#m-grey)"/>
  <text class="edgelabel" x="1402" y="550">sha256(file bytes)</text>
  <g class="endpoint" transform="translate(1390,590)">
    <ellipse rx="150" ry="28"/>
    <text>network_id</text>
  </g>

  <!-- ================= section 2: configure delivers + asserts ================= -->
  <line class="divider" x1="40" y1="660" x2="1580" y2="660"/>
  <text class="h2" x="40" y="704">every configure run: deliver + assert</text>
  <text class="subtitle" y="728">
    <tspan x="40">the committed summit-genesis.toml is a founding-era snapshot: configure splices each box's current IP</tspan>
    <tspan x="40" dy="17">(digest-excluded topology) into the delivered copy, then asserts the launch against the pins</tspan>
  </text>

  <!-- committed artifact feeds each configure run -->
  <path class="flow" d="M960 466 V772 L650 793" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="975" y="600">
    <tspan x="975">committed artifact copy</tspan>
    <tspan x="975" dy="16">(assemble-time validator IPs)</tspan>
  </text>

  <g class="node ephemeral" transform="translate(60,800)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">nodes/nodes.json (live IPs)</text>
  </g>
  <text class="caption" x="65" y="870">the stack's nodes output, saved as-is; gitignored</text>

  <g class="node tool" transform="translate(520,795)">
    <rect width="230" height="56" rx="8"/>
    <text x="115" y="29">configure (IP splice)</text>
  </g>
  <text class="caption" x="525" y="875">rewrites only [[validators]].ip_address</text>

  <g class="node ephemeral" transform="translate(870,795)">
    <rect width="250" height="56" rx="8"/>
    <text x="125" y="29">delivered genesis (tmp)</text>
  </g>
  <text class="caption" x="875" y="875">POSTed, never written back</text>

  <g class="endpoint" transform="translate(1370,823)">
    <ellipse rx="145" ry="28"/>
    <text>POSTed to every node</text>
  </g>
  <text class="edgelabel" x="1216" y="786" text-anchor="end">tdx-init [network] (base64)</text>

  <line class="flow purple" x1="385" y1="823" x2="515" y2="823" marker-end="url(#m-purple)"/>
  <line class="flow" x1="755" y1="823" x2="865" y2="823" marker-end="url(#m-dark)"/>
  <line class="flow" x1="1125" y1="823" x2="1219" y2="823" marker-end="url(#m-dark)"/>

  <!-- launch assertions close the loop against the pins -->
  <path class="flow green" d="M1370 851 V882" marker-end="url(#m-green)"/>
  <g class="endpoint" transform="translate(1370,915)">
    <ellipse rx="145" ry="28"/>
    <text>launch assertions</text>
  </g>
  <text class="caption" x="1370" y="962" text-anchor="middle">reth block 0 == eth.genesis_hash</text>
  <text class="caption" x="1370" y="979" text-anchor="middle">holder /v1/keys == pinned founding keys</text>

  <!-- footnote -->
  <text class="caption" x="60" y="1010">nodes/ — gitignored runtime state beside the artifact set: descriptors, bootnodes.json</text>
</svg>
