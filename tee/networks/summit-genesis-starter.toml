# Starter summit genesis: the authored input `init` copies into a network
# directory as inputs/summit-genesis.toml. Every value below is a per-network
# choice for the founder to review; nothing in it is derived. `assemble`
# completes the input with the two derived fields — eth_genesis_hash (from
# reth-genesis.json) and validators (the founding set: TEE-born keys
# harvested from the live cohort) — and ships summit's own rendering of the
# completed file, so comments here never reach the artifact.
#
# Review every value before founding a real network.

# `namespace` is the signature domain separator and must be unique per
# network (cohorts sharing one can cross-replay signatures), so a shared
# starter cannot choose it. Left empty, `init` fills it with the network
# name; set it to choose one yourself.
namespace = ""
leader_timeout_ms = 2000
notarization_timeout_ms = 4000
nullify_timeout_ms = 4000
activity_timeout_views = 256
skip_timeout_views = 32
max_message_size_bytes = 10485760
validator_minimum_stake = 32000000000
blocks_per_epoch = 10000
allowed_timestamp_future_ms = 10000
treasury_address = "0x0000000000000000000000000000000000000000"
max_deposits_per_epoch = 3
max_withdrawals_per_epoch = 16
observers_per_validator = 5
minimum_validator_count = 3
invalid_deposit_tax = 0
