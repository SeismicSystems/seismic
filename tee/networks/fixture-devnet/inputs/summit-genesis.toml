# Starter summit genesis for a network founded on this image: every
# consensus parameter the `summit` this image ships reads, spelled out
# explicitly — defaults included, so whoever founds a network reviews each
# one rather than inheriting it unseen.
#
# Nothing here is derived. Two fields summit's schema also carries are
# absent because they are per-network facts no starter can hold:
# `eth_genesis_hash`, which follows from the execution-layer genesis the
# same network is founded with, and `validators`, the founding set — keys
# that are born inside the TEEs this image boots and do not exist until the
# cohort runs.
#
# The parameter set is summit's, so the image build checks this file
# against the `summit` binary it just built, at the commit pinned in
# modules/seismic/sources.yaml: a parameter that summit adds, removes or
# renames fails the build of the image that would otherwise ship a starter
# no node it runs can load. The file lives at the repo root because summit
# is its long-term home; nothing in the image build reads it.

# `namespace` is the signature domain separator. It must be unique per
# network — two cohorts sharing one can cross-replay each other's
# signatures — so a file shared by every network cannot choose it. It ships
# empty, as a slot to fill with a name no other network uses.
namespace = "fixture-devnet"
leader_timeout_ms = 2000
notarization_timeout_ms = 4000
nullify_timeout_ms = 4000
activity_timeout_views = 256
max_message_size_bytes = 10485760
validator_minimum_stake = 32000000000
blocks_per_epoch = 10000
allowed_timestamp_future_ms = 10000
treasury_address = "0x0000000000000000000000000000000000000000"
max_deposits_per_epoch = 3
max_withdrawals_per_epoch = 16
observers_per_validator = 16
max_validator_count = 128
minimum_validator_count = 3
invalid_deposit_tax = 0
max_pending_withdrawals_per_validator = 3
