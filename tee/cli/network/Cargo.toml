[package]
name = "seismic-tee-network"
description = "The `network` command group and `verify-founding` of the Seismic TEE deploy CLI: a network directory's inputs and artifact set, and the audit of its founding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The same edges as ../node/Cargo.toml, and no edge to it: this group never
# contacts a node, so nothing that reaches one is in reach from here.
seismic-tee-common.workspace = true
seismic-tee-context.workspace = true

seismic-manifest.workspace = true
seismic-measurement-admission.workspace = true
seismic-verify-quote.workspace = true

alloy-primitives.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
hex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The shell-outs take paths, and `assemble` hashes artifacts that exist only
# as bytes until they are written.
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
seismic-tee-common = { workspace = true, features = ["test-support"] }
