[package]
name = "seismic-tee-common"
description = "Shared foundation of the Seismic TEE deploy CLI: node descriptor, network-directory layout, HTTP and error types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# A fake HTTP server and fixtures for the node and network crates' tests. A feature rather
# than a dev-dependency because the node and network crates share it, and a
# crate's dev-dependencies are not visible to its dependents.
test-support = ["dep:tempfile"]

[dependencies]
seismic-network-manifest.workspace = true

hex.workspace = true
jsonrpsee.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
