[package]
name = "seismic-tee-node"
description = "The `node` command group of the Seismic TEE deploy CLI: harvest, configure and appraise a cohort of running nodes, one or many"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The dependency direction the library crates are split on, as a Cargo edge:
# this group may reach the shared foundation and nothing else in this
# workspace — not the network crate, and it not this one. Where the seam runs
# is this file's decision, not that of whichever command first needs it.
seismic-tee-common.workspace = true
seismic-tee-context.workspace = true

# The enclave libraries the commands are built on. `configure` constructs the
# config POST as the type tdx-init deserializes it; `verify` and `harvest` run
# the relying-party check as the library call it is, and promote measurements
# with the same compiler `assemble` pins the founding policy with.
seismic-measurement-admission.workspace = true
seismic-verify-quote.workspace = true
tdx-init-config.workspace = true

anyhow.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
hex.workspace = true
jsonrpsee.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
terminal_size.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
seismic-tee-common = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
